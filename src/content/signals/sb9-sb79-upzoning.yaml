        "The SB 9 screen looks at parcels in the City’s RS single-family base zones with lots of at least 2,400 square feet, enough for two lots of 1,200 square feet. The SB 79 screen measures distance from the parcel boundary to a rail station or rapid-bus stop, in bands of 200 feet, a quarter mile and a half mile."
