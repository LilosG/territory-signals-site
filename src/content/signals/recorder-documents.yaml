  "answer": "Inherited property leads here come from recorder documents in ATTOM data, not from obituaries or court scraping. A transfer by death, trust or inheritance adds no points but can place a parcel in the Quiet inheritance recipe, which needs team approval. Default notices are scored as a financial signal. Both stay off lists and share pages.",
