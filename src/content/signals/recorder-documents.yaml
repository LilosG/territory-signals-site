    "what": {
      "q": "What is the inherited property signal?",
      "p": [
        "The inherited property signal is a recorded document showing that a property changed hands by death, trust or inheritance.",
        "Examples include an affidavit of death, an executor or administrator deed, a trust transfer or a deed of distribution. The same recorder history carries distress filings: a notice of default, a notice of trustee sale or a lis pendens."
      ]
    },
    "why": {
      "q": "Why can an inherited property point to a sale?",
      "p": [
        "An inherited property can point to a sale because a new owner or trustee may be deciding what to do with it.",
        "Some keep the home, some rent it and some sell. A default notice is a different matter: a public distress filing that shows pressure, not a completed sale."
      ]
    },
    "source": {
      "q": "Where does inherited property data come from?",
      "p": [
        "Inherited property data comes from ATTOM recorder history, with each document type mapped by a written table.",
        "Court probate records, published legal notices and obituaries are not scraped. Distress recordings are never counted as sales and never suppress a score. Transfers by death or trust do not trigger the recent-sale suppression."
