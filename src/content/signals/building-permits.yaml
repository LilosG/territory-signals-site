  "answer": "Building permit data for real estate agents shows which parcels have work approved, what kind of work it is and whether it was ever closed out. Territory Signals reads City of San Diego approvals, groups them by their text, matches them to parcels and weights each group differently. Routine systems work carries no weight.",
  "sections": {
    "what": {
      "q": "What is the building permit data signal?",
      "p": [
        "The building permit data signal is a City approval, or an expired and unclosed approval, matched to a specific parcel.",
        "Approvals are sorted into groups: pre-sale prep, remodel or addition, ADU, demolition or lot split, and solar or energy. Electrical, plumbing and mechanical permits are only candidates for pre-sale prep. The permit text decides: cosmetic or remodel scope stays, while like-for-like work such as a furnace, water heater or repipe is treated as maintenance and scores nothing. MEP permits that name an ADU or a conversion into units count as ADU work.",
        "A stalled permit is a remodel, ADU or demolition approval that expired more than 90 days ago, and no more than 36 months ago, with no close date."
      ]
    },
    "why": {
      "q": "Why can building permit data point to a sale?",
      "p": [
        "Building permit data can point to a sale because owners often put work into a home before changing what they do with it.",
        "Cosmetic and remodel work is the kind of work that often goes in before a listing. A demolition or lot-split approval points to a redevelopment plan. An expired permit may mean an unfinished project, which can make a conversation about the home’s value timely. None of these shows that an owner has decided to sell."
      ]
    },
    "source": {
      "q": "Where does building permit data come from?",
      "p": [
        "The building permit data comes from the City of San Diego development permit approvals files, published by Development Services.",
        "The City portal lists the dataset as updated daily. Where a row has a parcel number it is matched on that number; otherwise location or address is used. Rows that cannot be placed on a parcel are counted and left out. The permit holder’s name is not kept. The rules that read permit text are written patterns, not a model’s judgment."
      ]
    },
    "scoring": {
      "q": "How is building permit data scored?",
      "p": [
        "Building permit data is scored by group, with newer approvals worth more than old ones.",
        "Each parcel counts the strongest, most recent approval in each group once, so a run of re-roof permits does not pile up. Several permits of one kind approved on the same day read as a single phrase in the reason line."
      ]
